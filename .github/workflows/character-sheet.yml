name: character-sheet

on:
  push:
    branches: [main]
    paths:
      - "character-sheet/**"
      - ".github/workflows/character-sheet.yml"
  pull_request:
    paths:
      - "character-sheet/**"
      - ".github/workflows/character-sheet.yml"

concurrency:
  group: character-sheet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: character-sheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: character-sheet/package-lock.json
      - run: npm ci
      # Тесты проверяют наличие .env.local; реальные ключи в CI не нужны.
      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://ci-project.supabase.co" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key" >> .env.local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
